name: Autobuild OpenWrt

on:
  schedule:
    - cron: '0 18 1,15 * *' # 2nd and 16th at 2:00 AM UTC+8
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Build every source even if upstream has not moved'
        required: false
        type: boolean
        default: false
      only:
        description: "Comma-separated source ids, e.g. 'lede,openwrt' (default: all)"
        required: false
        default: ''

permissions:
  contents: write

env:
  TZ: Asia/Shanghai

jobs:
  check-upstream:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
      any: ${{ steps.resolve.outputs.any }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Resolve upstream heads
        id: resolve
        env:
          FORCE: ${{ inputs.force_build }}
          ONLY: ${{ inputs.only }}
        run: ./scripts/resolve-upstream.sh

  build:
    needs: check-upstream
    if: needs.check-upstream.outputs.any == 'true'
    runs-on: ubuntu-22.04
    # One source failing must not hide the state of the other three.
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.check-upstream.outputs.matrix) }}
    name: build (${{ matrix.id }})

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Initialization environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force

          # moby's hack/make/binary-daemon copies host binaries into the bundle
          # whenever /usr/local/bin/runc exists. The runner ships runc but has
          # no docker-init, rootlesskit or dockerd-rootless.sh, so `command -v`
          # returns empty and the build dies with "cp: cannot stat ''", taking
          # the dockerd package with it. Deleting runc makes the copy return
          # early; docker-proxy still comes from the separate binary-proxy
          # target, so nothing the package installs is lost.
          sudo rm -f /usr/local/bin/runc

          # Do not reach for a dependency list over the network. The upstream
          # template used `curl -fsSL git.io/depends-ubuntu-1804`; git.io shut
          # down in 2022, curl -f exited non-zero, and `apt-get install` with no
          # arguments exits 0 -- so the step stayed green while every build ran
          # without its dependencies.
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib git \
            gperf haveged help2man intltool libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev libltdl-dev \
            libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev libssl-dev libtool \
            lrzsz mkisofs msmtp ninja-build p7zip p7zip-full patch pkgconf python2.7 python3 python3-pyelftools \
            python3-setuptools qemu-utils rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip \
            vim wget xmlto xxd zlib1g-dev zstd
          sudo -E apt-get -qq autoremove --purge
          sudo -E apt-get -qq clean
          sudo timedatectl set-timezone "$TZ"
          sudo mkdir -p /workdir
          sudo chown $USER:$GROUPS /workdir

      - name: Clone source code
        working-directory: /workdir
        run: |
          set -euo pipefail
          df -hT $PWD
          git clone --depth 1 --branch '${{ matrix.branch }}' '${{ matrix.repo }}' openwrt
          cd openwrt
          head="$(git rev-parse HEAD)"
          if [ "$head" != '${{ matrix.sha }}' ]; then
            # Upstream moved between resolve and clone. Pin to the SHA the
            # release will claim, so the two can never disagree.
            git fetch --depth 1 origin '${{ matrix.sha }}'
            git checkout --detach '${{ matrix.sha }}'
          fi
          git --no-pager log -1 --format='pinned at %H (%ad)'
          ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

      - name: Load custom feeds
        run: |
          set -euo pipefail
          chmod +x '${{ matrix.diy1 }}'
          cd openwrt
          "$GITHUB_WORKSPACE/${{ matrix.diy1 }}"
          echo '--- feeds.conf.default ---'
          cat feeds.conf.default

      - name: Update feeds
        run: cd openwrt && ./scripts/feeds update -a

      - name: Install feeds
        run: cd openwrt && ./scripts/feeds install -a

      - name: Load custom configuration
        run: |
          set -euo pipefail
          cp '${{ matrix.config }}' openwrt/.config
          chmod +x scripts/diy-part2.sh
          cd openwrt
          "$GITHUB_WORKSPACE/scripts/diy-part2.sh"

      - name: Download package
        run: |
          cd openwrt
          make defconfig
          make download -j8
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -exec rm -f {} \;

      - name: Compile the firmware
        id: compile
        run: |
          cd openwrt
          echo -e "$(nproc) thread compile"
          make -j$(nproc) || make -j1 || make -j1 V=s
          echo "status=success" >> $GITHUB_OUTPUT

      - name: Upload build logs
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: build-logs-${{ matrix.id }}
          path: openwrt/logs
          if-no-files-found: ignore
          retention-days: 30

      - name: Check space usage
        if: (!cancelled())
        run: df -hT

      - name: Organize files
        id: organize
        if: steps.compile.outputs.status == 'success' && !cancelled()
        run: |
          set -euo pipefail
          cd openwrt/bin/targets/*/*
          rm -rf packages
          echo "FIRMWARE=$PWD" >> $GITHUB_ENV
          echo "status=success" >> $GITHUB_OUTPUT

      - name: Upload firmware directory
        uses: actions/upload-artifact@v7
        if: steps.organize.outputs.status == 'success' && !cancelled()
        with:
          name: firmware-${{ matrix.id }}
          path: ${{ env.FIRMWARE }}

      - name: Generate release metadata
        id: meta
        if: steps.organize.outputs.status == 'success' && !cancelled()
        run: |
          set -euo pipefail
          echo "tag=${{ matrix.id }}-$(date +%Y.%m.%d-%H%M)" >> $GITHUB_OUTPUT
          {
            echo "Unofficial automated build. Not affiliated with, endorsed by, or reviewed by upstream."
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Source | [${{ matrix.title }}](${{ matrix.repo }}) |"
            echo "| Branch | \`${{ matrix.branch }}\` |"
            echo "| Commit | [\`${{ matrix.sha }}\`](${{ matrix.repo }}/commit/${{ matrix.sha }}) |"
            echo "| Target | x86_64 generic, EFI |"
            echo "| Built | $(date -u '+%Y-%m-%d %H:%M UTC') |"
          } > release.md
          echo "status=success" >> $GITHUB_OUTPUT

      - name: Upload firmware to release
        uses: softprops/action-gh-release@v3
        if: steps.meta.outputs.status == 'success' && !cancelled()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ matrix.title }} ${{ steps.meta.outputs.tag }}
          body_path: release.md
          prerelease: true
          files: ${{ env.FIRMWARE }}/*

      - name: Remove old releases for this source
        if: steps.meta.outputs.status == 'success' && !cancelled()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName,createdAt \
            --jq 'sort_by(.createdAt) | reverse | map(select(.tagName | startswith("${{ matrix.id }}-"))) | .[3:] | .[].tagName' \
          | while read -r tag; do
              [ -n "$tag" ] || continue
              echo "Deleting release $tag"
              gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
            done

      - name: Record built commit
        if: steps.meta.outputs.status == 'success' && !cancelled()
        run: |
          mkdir -p lockbit
          echo '${{ matrix.id }} ${{ matrix.sha }}' > "lockbit/${{ matrix.id }}.txt"

      - name: Upload built commit
        uses: actions/upload-artifact@v7
        if: steps.meta.outputs.status == 'success' && !cancelled()
        with:
          name: upstream-${{ matrix.id }}
          path: lockbit/${{ matrix.id }}.txt
          retention-days: 1

  record:
    needs: [check-upstream, build]
    # always(): a source that failed must still leave the other three recorded.
    if: always() && needs.check-upstream.outputs.any == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Collect built commits
        uses: actions/download-artifact@v8
        with:
          pattern: upstream-*
          path: lockbits
          merge-multiple: true
        continue-on-error: true

      - name: Advance the lock for sources that actually built
        run: |
          set -euo pipefail

          # A build window is hours long, so main has very likely moved since
          # this job checked out. Rebuild the lock on top of whatever main is
          # now and retry, rather than pushing a stale ref and failing.
          # lockbits/ is untracked, so `reset --hard` leaves it alone.
          for attempt in 1 2 3; do
            git fetch -q origin main
            git reset -q --hard origin/main

            [ -s upstream.lock ] || echo '{}' > upstream.lock
            lock="$(cat upstream.lock)"
            shopt -s nullglob
            for f in lockbits/*.txt; do
              id="$(cut -d' ' -f1 "$f")"
              sha="$(cut -d' ' -f2 "$f")"
              echo "recording $id -> ${sha:0:12}"
              lock="$(printf '%s' "$lock" | jq --arg i "$id" --arg s "$sha" '.[$i] = $s')"
            done
            printf '%s\n' "$lock" | jq -S . > upstream.lock

            # A source whose build failed keeps its old SHA on purpose: the next
            # scheduled run then retries it instead of skipping it as "unchanged".
            if [ -z "$(git status --porcelain upstream.lock)" ]; then
              echo 'lock already up to date'
              exit 0
            fi

            git config user.name  'github-actions[bot]'
            git config user.email 'github-actions[bot]@users.noreply.github.com'
            git add upstream.lock
            git commit -q -m 'Record upstream commits for successful builds'
            if git push -q; then
              echo 'lock pushed'
              exit 0
            fi
            echo "push rejected, retrying ($attempt/3)"
            sleep 5
          done

          echo '::error::could not push upstream.lock after 3 attempts'
          exit 1
