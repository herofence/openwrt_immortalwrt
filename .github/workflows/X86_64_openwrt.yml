name: Autobuild ImmortalWrt

on:
  schedule:
    - cron: '0 18 1,15 * *' # 每月2日和16日 UTC+8 02:00
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Build even if upstream has not moved'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

env:
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    name: build ImmortalWrt

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Initialization environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo rm -f /usr/local/bin/runc
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib git \
            gperf haveged help2man intltool libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev libltdl-dev \
            libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev libssl-dev libtool \
            lrzsz mkisofs msmtp ninja-build p7zip p7zip-full patch pkgconf python2.7 python3 python3-pyelftools \
            python3-setuptools qemu-utils rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip \
            vim wget xmlto xxd zlib1g-dev zstd
          sudo -E apt-get -qq autoremove --purge
          sudo -E apt-get -qq clean
          sudo timedatectl set-timezone "$TZ"
          sudo mkdir -p /workdir
          sudo chown $USER:$GROUPS /workdir

      - name: Clone ImmortalWrt source code
        working-directory: /workdir
        run: |
          set -euo pipefail
          df -hT $PWD
          git clone --depth 1 --branch master https://github.com/immortalwrt/immortalwrt openwrt
          cd openwrt
          git --no-pager log -1 --format='cloned at %H (%ad)'
          ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

      - name: Load custom feeds
        run: |
          set -euo pipefail
          chmod +x scripts/diy-immortalwrt-part1.sh
          cd openwrt
          "$GITHUB_WORKSPACE/scripts/diy-immortalwrt-part1.sh"
          echo '--- feeds.conf.default ---'
          cat feeds.conf.default

      - name: Update feeds
        run: cd openwrt && ./scripts/feeds update -a

      - name: Install feeds
        run: cd openwrt && ./scripts/feeds install -a

      - name: Load custom configuration
        run: |
          set -euo pipefail
          cp config/immortalwrt.config openwrt/.config
          chmod +x scripts/diy-part2.sh
          cd openwrt
          "$GITHUB_WORKSPACE/scripts/diy-part2.sh"

      - name: Download package
        run: |
          cd openwrt
          make defconfig
          make download -j8
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -exec rm -f {} \;

      - name: Compile the firmware
        id: compile
        run: |
          cd openwrt
          echo -e "$(nproc) thread compile"
          make -j$(nproc) || make -j1 || make -j1 V=s
          echo "status=success" >> $GITHUB_OUTPUT

      - name: Upload build logs
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: build-logs-immortalwrt
          path: openwrt/logs
          if-no-files-found: ignore
          retention-days: 30

      - name: Check space usage
        if: (!cancelled())
        run: df -hT

      - name: Organize files
        id: organize
        if: steps.compile.outputs.status == 'success' && !cancelled()
        run: |
          set -euo pipefail
          cd openwrt/bin/targets/*/*
          rm -rf packages
          echo "FIRMWARE=$PWD" >> $GITHUB_ENV
          echo "status=success" >> $GITHUB_OUTPUT

      - name: Upload firmware directory
        uses: actions/upload-artifact@v7
        if: steps.organize.outputs.status == 'success' && !cancelled()
        with:
          name: firmware-immortalwrt
          path: ${{ env.FIRMWARE }}

      - name: Generate release metadata
        id: meta
        if: steps.organize.outputs.status == 'success' && !cancelled()
        run: |
          set -euo pipefail
          echo "tag=immortalwrt-$(date +%Y.%m.%d-%H%M)" >> $GITHUB_OUTPUT
          {
            echo "Unofficial automated build. Not affiliated with, endorsed by, or reviewed by upstream."
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Source | [ImmortalWrt](https://github.com/immortalwrt/immortalwrt) |"
            echo "| Branch | \`master\` |"
            echo "| Target | x86_64 generic, EFI |"
            echo "| Built | $(date -u '+%Y-%m-%d %H:%M UTC') |"
          } > release.md
          echo "status=success" >> $GITHUB_OUTPUT

      - name: Upload firmware to release
        uses: softprops/action-gh-release@v3
        if: steps.meta.outputs.status == 'success' && !cancelled()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ImmortalWrt ${{ steps.meta.outputs.tag }}
          body_path: release.md
          prerelease: true
          files: ${{ env.FIRMWARE }}/*

      - name: Remove old releases for ImmortalWrt
        if: steps.meta.outputs.status == 'success' && !cancelled()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName,createdAt \
            --jq 'sort_by(.createdAt) | reverse | map(select(.tagName | startswith("immortalwrt-"))) | .[3:] | .[].tagName' \
          | while read -r tag; do
              [ -n "$tag" ] || continue
              echo "Deleting release $tag"
              gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
            done
