name: ImmortalWrt_X86

on:
  schedule:
    - cron: '0 18 1,15 * *' # 每月2日和16日 UTC+8 02:00
  workflow_dispatch: # 手动触发，无输入参数

permissions:
  contents: write

env:
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    name: 编译 ImmortalWrt

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v5

      - name: 初始化编译环境
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo rm -f /usr/local/bin/runc
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib git \
            gperf haveged help2man intltool libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev libltdl-dev \
            libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev libssl-dev libtool \
            lrzsz mkisofs msmtp ninja-build p7zip p7zip-full patch pkgconf python2.7 python3 python3-pyelftools \
            python3-setuptools qemu-utils rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip \
            vim wget xmlto xxd zlib1g-dev zstd
          sudo -E apt-get -qq autoremove --purge
          sudo -E apt-get -qq clean
          sudo timedatectl set-timezone "$TZ"
          sudo mkdir -p /workdir
          sudo chown $USER:$GROUPS /workdir

      - name: 克隆 ImmortalWrt 源码
        working-directory: /workdir
        run: |
          set -euo pipefail
          df -hT $PWD
          git clone --depth 1 --branch master https://github.com/immortalwrt/immortalwrt openwrt
          cd openwrt
          git --no-pager log -1 --format='cloned at %H (%ad)'
          ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

      - name: 加载自定义软件源
        run: |
          set -euo pipefail
          chmod +x scripts/diy-part1.sh
          cd openwrt
          "$GITHUB_WORKSPACE/scripts/diy-part1.sh"
          echo '--- feeds.conf.default ---'
          cat feeds.conf.default

      - name: 更新软件源
        run: cd openwrt && ./scripts/feeds update -a

      - name: 安装软件包
        run: cd openwrt && ./scripts/feeds install -a

      - name: 加载自定义配置
        run: |
          set -euo pipefail
          cp configs/X86.config openwrt/.config
          chmod +x scripts/diy-part2.sh
          cd openwrt
          "$GITHUB_WORKSPACE/scripts/diy-part2.sh"

      - name: 下载编译所需源码包
        run: |
          cd openwrt
          make defconfig
          make download -j8
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -exec rm -f {} \;

      - name: 编译固件
        id: compile
        run: |
          cd openwrt
          echo -e "$(nproc) thread compile"
          make -j$(nproc) || make -j1 || make -j1 V=s
          echo "status=success" >> $GITHUB_OUTPUT

      - name: 上传编译日志（失败时）
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: build-logs-immortalwrt
          path: openwrt/logs
          if-no-files-found: ignore
          retention-days: 30

      - name: 检查磁盘空间
        if: (!cancelled())
        run: df -hT

      - name: 整理固件文件
        id: organize
        if: steps.compile.outputs.status == 'success' && !cancelled()
        run: |
          set -euo pipefail
          cd openwrt/bin/targets/*/*
          rm -rf packages
          echo "FIRMWARE=$PWD" >> $GITHUB_ENV
          echo "status=success" >> $GITHUB_OUTPUT

      - name: 上传固件目录
        uses: actions/upload-artifact@v7
        if: steps.organize.outputs.status == 'success' && !cancelled()
        with:
          name: firmware-immortalwrt
          path: ${{ env.FIRMWARE }}

      - name: 生成发布信息
        id: meta
        if: steps.organize.outputs.status == 'success' && !cancelled()
        run: |
          set -euo pipefail
          echo "tag=immortalwrt-$(date +%Y.%m.%d-%H%M)" >> $GITHUB_OUTPUT
          {
            echo "Unofficial automated build. Not affiliated with, endorsed by, or reviewed by upstream."
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Source | [ImmortalWrt](https://github.com/immortalwrt/immortalwrt) |"
            echo "| Branch | \`master\` |"
            echo "| Target | x86_64 generic, EFI |"
            echo "| Built | $(date -u '+%Y-%m-%d %H:%M UTC') |"
          } > release.md
          echo "status=success" >> $GITHUB_OUTPUT

      - name: 上传固件到 Release
        uses: softprops/action-gh-release@v3
        if: steps.meta.outputs.status == 'success' && !cancelled()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ImmortalWrt ${{ steps.meta.outputs.tag }}
          body_path: release.md
          prerelease: true
          files: ${{ env.FIRMWARE }}/*
