name: Build iStore OS for NanoPi M4

on:
  push:
    branches:
      - main
    tags:
      - "iStoreOS-*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: 1_Checkout
      uses: actions/checkout@v4

    - name: 2_Free up disk space
      uses: jlumbroso/free-disk-space@main
      with:
        tool-cache: false
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        docker-images: true
        swap-storage: true

    - name: 3_Build FriendlyElec U-Boot
      run: |
        set -e
        sudo apt-get update
        sudo apt-get install -y git bc bison build-essential flex gcc-aarch64-linux-gnu device-tree-compiler python3 swig libssl-dev

        mkdir -p /tmp/friendlyelec
        cd /tmp/friendlyelec
        git clone --depth 1 -b friendlyelec https://github.com/friendlyarm/rkbin.git
        git clone --depth 1 -b nanopi4-v2017.09 https://github.com/friendlyarm/uboot-rockchip.git

        cd uboot-rockchip
        export RKCHIP=rk3399
        ./make.sh nanopi4

        echo "=== U-Boot build output ==="
        ls -la *.bin *.img 2>/dev/null || echo "No .bin/.img in build dir"

        mkdir -p /tmp/uboot-final

        # make.sh produces *_loader_*.bin (e.g. RK3399MiniLoaderAll*.bin), not idbloader.bin
        LOADER_FILE=$(ls *_loader_*.bin 2>/dev/null | head -1)

        if [ -n "$LOADER_FILE" ] && [ -f uboot.img ]; then
          echo "Found loader: $LOADER_FILE, uboot.img"
          cp "$LOADER_FILE" /tmp/uboot-final/
          cp uboot.img /tmp/uboot-final/
          cp trust.img /tmp/uboot-final/ 2>/dev/null || true
          # Create combined image: loader at sector 0, uboot at sector 64
          dd if="$LOADER_FILE" of=/tmp/uboot-final/u-boot-rockchip.bin bs=512 conv=notrunc
          dd if=uboot.img of=/tmp/uboot-final/u-boot-rockchip.bin bs=512 seek=64 conv=notrunc
          echo "=== Created combined u-boot-rockchip.bin ==="
        elif [ -f uboot.img ]; then
          echo "WARNING: No loader bin found, using uboot.img only"
          cp uboot.img /tmp/uboot-final/
          cp trust.img /tmp/uboot-final/ 2>/dev/null || true
        else
          echo "ERROR: U-Boot build did not produce expected files"
          ls -la
          exit 1
        fi

        echo "=== U-Boot final files ==="
        ls -la /tmp/uboot-final/

    - name: 4_Clone iStore OS and configure
      run: |
        sudo apt-get install -y ack antlr3 asciidoc autoconf automake binutils bison build-essential bzip2 ccache clang cmake cpio curl device-tree-compiler ecj fastjar flex gawk gettext gcc-multilib g++-multilib gnutls-dev gperf haveged help2man intltool lib32gcc-s1 libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev libssl-dev libtool lrzsz mkisofs msmtp nano ninja-build p7zip p7zip-full patch pkgconf python2.7 python3 python3-pip python3-ply python3-docutils python3-pyelftools python3-setuptools qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo uglifyjs unzip vim wget xmlto xxd zlib1g-dev
        rm -rf istoreos
        git clone -b istoreos-24.10 --depth 1 https://github.com/istoreos/istoreos.git

    - name: 5_Add NanoPi M4 and inject U-Boot
      working-directory: istoreos
      run: |
        # Add device to armv8.mk
        if ! grep -q "nanopi-m4" target/linux/rockchip/image/armv8.mk; then
          sed -n '/define Device\/friendlyarm_nanopc-t4/,/TARGET_DEVICES += friendlyarm_nanopc-t4/p' target/linux/rockchip/image/armv8.mk > /tmp/nanopc-t4-def.txt
          sed 's/nanopc-t4/nanopi-m4/g; s/NanoPC T4/NanoPi M4/g' /tmp/nanopc-t4-def.txt >> target/linux/rockchip/image/armv8.mk
        fi

        # Add U-Boot definition
        if ! grep -q "nanopi-m4-rk3399" package/boot/uboot-rockchip/Makefile; then
          sed -n '/define U-Boot\/nanopc-t4-rk3399/,/^endef/p' package/boot/uboot-rockchip/Makefile > /tmp/nanopc-t4-uboot.txt
          sed 's/nanopc-t4/nanopi-m4/g; s/NanoPC T4/NanoPi M4/g' /tmp/nanopc-t4-uboot.txt >> package/boot/uboot-rockchip/Makefile
          sed -i '/nanopc-t4-rk3399/a\  nanopi-m4-rk3399 \\' package/boot/uboot-rockchip/Makefile
        fi

    - name: 6_Configure iStore OS
      working-directory: istoreos
      run: |
        ./scripts/feeds update -a
        ./scripts/feeds install -a
        echo "CONFIG_TARGET_rockchip=y" > .config
        echo "CONFIG_TARGET_rockchip_armv8=y" >> .config
        echo "CONFIG_TARGET_rockchip_armv8_DEVICE_friendlyarm_nanopi-m4=y" >> .config
        echo "CONFIG_TARGET_ROOTFS_EXT4FS=y" >> .config
        echo "CONFIG_TARGET_ROOTFS_SQUASHFS=y" >> .config
        echo "CONFIG_TARGET_ROOTFS_PARTSIZE=4096" >> .config
        echo "CONFIG_PACKAGE_luci=y" >> .config
        echo "CONFIG_PACKAGE_luci-theme-bootstrap=y" >> .config
        echo "CONFIG_PACKAGE_luci-app-dockerman=y" >> .config
        echo "CONFIG_PACKAGE_docker-ce=y" >> .config
        echo "CONFIG_PACKAGE_docker-ce-cli=y" >> .config
        echo "CONFIG_PACKAGE_containerd=y" >> .config
        echo "CONFIG_PACKAGE_luci-app-store=y" >> .config
        make defconfig

    - name: 7_Build U-Boot and inject
      working-directory: istoreos
      run: |
        make package/boot/uboot-rockchip/compile -j$(nproc) V=s || true

        UBOOT_STAGING=staging_dir/target-aarch64_generic_musl/image
        mkdir -p "$UBOOT_STAGING"

        echo "=== Check staging ==="
        ls -la "$UBOOT_STAGING"/ 2>/dev/null | grep -i "nanopi\|u-boot\|uboot" || echo "No nanopi-m4 u-boot in staging"

        TARGET="$UBOOT_STAGING/nanopi-m4-rk3399-u-boot-rockchip.bin"
        if [ ! -f "$TARGET" ]; then
          echo "=== Injecting pre-built U-Boot ==="
          if [ -f /tmp/uboot-final/u-boot-rockchip.bin ]; then
            cp /tmp/uboot-final/u-boot-rockchip.bin "$TARGET"
            echo "Injected combined u-boot-rockchip.bin"
          elif [ -f /tmp/uboot-final/uboot.img ]; then
            cp /tmp/uboot-final/uboot.img "$TARGET"
            echo "Injected uboot.img as fallback"
          else
            echo "ERROR: No pre-built U-Boot available"
            ls -la /tmp/uboot-final/
            exit 1
          fi
        fi

        echo "=== Final check ==="
        ls -la "$UBOOT_STAGING"/ | grep -i "nanopi\|u-boot\|uboot" || echo "WARNING: Still no nanopi-m4 u-boot files"

    - name: 8_Compile firmware
      working-directory: istoreos
      run: |
        make -j$(nproc) || make -j1 V=s
        echo "BUILD_STATUS=success" >> $GITHUB_ENV

    - name: 9_Organize files
      if: env.BUILD_STATUS == 'success'
      working-directory: istoreos
      run: |
        mkdir -p ../output
        find bin/targets -name "*.img.gz" -exec cp {} ../output/ \;
        find bin/targets -name "*.img" -exec cp {} ../output/ \;
        find bin/targets -name "*.bin" -exec cp {} ../output/ \;
        find bin/targets -name "*.itb" -exec cp {} ../output/ \;
        ls -la ../output/

    - name: 10_Upload firmware
      uses: actions/upload-artifact@v4
      if: env.BUILD_STATUS == 'success'
      with:
        name: iStoreOS-NanoPiM4-${{ github.run_id }}
        path: output/

    - name: 11_Generate release tag
      id: tag
      if: env.BUILD_STATUS == 'success'
      run: echo "RELEASE_TAG=iStoreOS-$(date +%%Y.%%m.%%d.%%H%%M)" >> $GITHUB_OUTPUT

    - name: 11_Create Release
      if: env.BUILD_STATUS == 'success'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.tag.outputs.RELEASE_TAG }}
        name: "iStore OS NanoPi M4 Build ${{ github.run_id }}"
        body: |
          ## iStore OS NanoPi M4 Build
          ### Features
          - Docker 支持
          - iStore 应用商店
          ### Default Login
          - 地址: 192.168.1.1
          - 密码: password
          ### Files
          - *.img.gz / *.img - 固件镜像 (写入 TF卡/eMMC)
        files: |
          output/*.img.gz
          output/*.img
          output/*.bin
          output/*.itb
        draft: false
        prerelease: false
        fail_on_unmatched_files: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
